<style>

:root{
  --bg:#F5F6F4; --ink:#16191C; --muted:#6B7178; --line:#E3E4E0;
  --confirm-green:#2E7D5B; --stamp-red:#B4423F;
  --accent:#155A4C; --accent-dark:#0E4438; --accent-tint:#E7F2EE;
  --shadow-sm:0 1px 2px rgba(20,25,22,.06), 0 1px 1px rgba(20,25,22,.04);
  --shadow-md:0 6px 20px rgba(20,25,22,.07), 0 2px 6px rgba(20,25,22,.05);
  --radius:14px; --radius-sm:9px;
}
*{box-sizing:border-box;}
body{margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; padding:24px 16px 60px;}
.wrap{max-width:960px; margin:0 auto;}
h1{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.5px; font-size:24px; margin-bottom:16px; padding-bottom:16px; border-bottom:3px solid var(--accent);}
.eyebrow{font-family:'Space Mono',monospace; font-size:11px; letter-spacing:3px; color:var(--muted); text-transform:uppercase;}
.card{border:1px solid var(--line); border-radius:var(--radius); padding:22px; margin-bottom:18px; background:#fff; box-shadow:var(--shadow-sm);}
.field-row{margin-bottom:14px;}
.field-row label{display:block; font-family:'Space Mono',monospace; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin-bottom:5px;}
input, select{width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:var(--radius-sm); font-family:'Inter',sans-serif; font-size:14px; transition:border-color .15s, box-shadow .15s;}
input:focus, select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-tint);}
.btn{border:none; background:var(--accent); color:#fff; border-radius:var(--radius-sm); padding:12px 18px; font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; cursor:pointer; font-size:14px; box-shadow:var(--shadow-sm); transition:background .15s, transform .1s, box-shadow .15s;}
@media (hover:hover){ .btn:hover{background:var(--accent-dark); transform:translateY(-1px); box-shadow:var(--shadow-md);} }
.btn.outline{background:transparent; color:var(--accent); border:1.5px solid var(--accent); box-shadow:none;}
@media (hover:hover){ .btn.outline:hover{background:var(--accent-tint); box-shadow:none; transform:none;} }
.btn.small{padding:7px 12px; font-size:11px; border-radius:7px;}
.error-text{color:var(--stamp-red); font-size:13px; margin-top:8px; min-height:16px;}
table{width:100%; border-collapse:collapse; font-size:13px;}
th, td{border-bottom:1px solid var(--line); padding:10px 8px; text-align:left;}
th{font-family:'Space Mono',monospace; font-size:10.5px; text-transform:uppercase; color:var(--muted);}
tbody tr{transition:background .12s;}
@media (hover:hover){ tbody tr:hover{background:var(--accent-tint);} }
.tag{display:inline-block; padding:3px 10px; border-radius:20px; font-family:'Space Mono',monospace; font-size:10.5px; text-transform:uppercase; background:var(--accent-tint); color:var(--accent-dark);}
.hidden{display:none !important;}
.month-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.month-nav button{border:1.5px solid var(--line); background:#fff; border-radius:var(--radius-sm); padding:6px 16px; cursor:pointer; font-family:'Oswald',sans-serif; transition:background .12s, border-color .12s;}
@media (hover:hover){ .month-nav button:hover{background:var(--accent-tint); border-color:var(--accent);} }
.month-label{font-family:'Space Mono',monospace; font-size:15px; text-transform:capitalize;}
.total-geral{font-family:'Oswald',sans-serif; font-size:18px; text-transform:uppercase; margin-top:6px; color:var(--accent-dark);}
.modal-overlay{display:none; position:fixed; inset:0; background:rgba(15,20,18,.55); z-index:50; align-items:center; justify-content:center; padding:16px;}
.modal-overlay.show{display:flex;}
.modal{background:#fff; border-radius:18px; padding:24px; max-width:420px; width:100%; max-height:90vh; overflow-y:auto; box-shadow:var(--shadow-md);}
.receipt-row{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line); font-size:13.5px;}
.receipt-row.total{font-weight:700; border-bottom:none; border-top:2px solid var(--ink); margin-top:6px; padding-top:10px;}


/* ================= iPhone / toque =================
   O que travava o uso no iOS Safari:
   - campo com fonte menor que 16px faz o iOS dar zoom ao tocar e a tela fica deslocada;
   - modal com 90vh passa da área visível (a barra do Safari cobre os botões);
   - botões menores que 44px, tabela larga demais e :hover que "gruda" depois do toque;
   - a página de trás rolava junto com o modal aberto. */
html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
html.modal-aberto, html.modal-aberto body{overflow:hidden;}
body{min-height:100vh; min-height:100dvh; -webkit-tap-highlight-color:transparent;}
button, select, label, summary, [role="button"]{touch-action:manipulation;}
input, select, textarea{font-size:16px !important; min-width:0; max-width:100%;}
.modal-overlay{overscroll-behavior:contain;}
.modal{max-height:100% !important; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;}
/* Fechar/Imprimir sempre à vista no holerite (o conteúdo rola por baixo) */
.modal > div:last-child{position:sticky; bottom:-24px; background:#fff; padding:12px 0 14px;}
.receipt-row span:last-child{white-space:nowrap; margin-left:12px;}
.table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
@media (max-width:640px){
  body{padding:16px 12px 40px;}
  .card{padding:16px 14px;}
  .folha-table thead{display:none;}
  .folha-table, .folha-table tbody, .folha-table tr, .folha-table td{display:block; width:100%;}
  .folha-table tr{border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin-bottom:10px; background:#fff; box-shadow:var(--shadow-sm);}
  .folha-table td{border:none; padding:5px 0; display:flex; justify-content:space-between; align-items:center; gap:12px;}
  .folha-table td::before{content:attr(data-label); font-family:'Space Mono',monospace; font-size:10.5px; text-transform:uppercase; color:var(--muted); flex-shrink:0;}
  .folha-table td.col-nome{font-family:'Oswald',sans-serif; font-size:17px; padding-bottom:6px; margin-bottom:4px; border-bottom:1px dashed var(--line);}
  .folha-table td.col-nome::before{content:none;}
  .folha-table td.col-acao{padding-top:8px;}
  .folha-table td.col-acao::before{content:none;}
  .folha-table td.col-acao .btn{width:100%;}
  .folha-table tbody tr:hover{background:#fff;}
}
@media (pointer:coarse){
  .btn{min-height:46px;}
  .btn.small{min-height:44px; padding:10px 14px; font-size:12px;}
  .month-nav button{min-width:56px; min-height:44px; font-size:18px;}
  input:not([type="checkbox"]):not([type="radio"]), select{min-height:46px;}
}

</style>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>

<script src="ponto-core.js"></script>
<script>
// Mesmo projeto Firebase dos outros dois sites — mesmo banco de dados.
const firebaseConfig = {
  apiKey: "AIzaSyA_hyosRTkvlk8_Qj-V9k0-2fiy1b9MYVM",
  authDomain: "controle-ponto-7a04d.firebaseapp.com",
  projectId: "controle-ponto-7a04d",
  storageBucket: "controle-ponto-7a04d.firebasestorage.app",
  messagingSenderId: "458473922894",
  appId: "1:458473922894:web:f72ee3fa6f017af660fe1f",
  measurementId: "G-F7VQSSTHNN"
};
// App nomeado (não "[DEFAULT]") pra não compartilhar sessão de login com
// os outros dois sites (mesmo domínio do GitHub Pages).
const pagApp = firebase.initializeApp(firebaseConfig, 'PagamentosApp');
const auth = pagApp.auth();
const FIRESTORE_REST_BASE = `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/default/documents`;

let employeesData = [];
// Mês atual pela data LOCAL (toISOString() é UTC e vira o mês antes da hora).
let viewMonth = PontoCore.currentMonthKey();

function pad(n){ return String(n).padStart(2,'0'); }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function on(id, ev, fn){ const el=document.getElementById(id); if(el) el.addEventListener(ev, fn); }
async function authToken(){ return auth.currentUser ? await auth.currentUser.getIdToken() : null; }

function firestoreFieldsToObj(fields){
  if(!fields) return {};
  const out = {};
  for(const k in fields){
    const v = fields[k];
    if(v.stringValue !== undefined) out[k] = v.stringValue;
    else if(v.integerValue !== undefined) out[k] = parseInt(v.integerValue,10);
    else if(v.doubleValue !== undefined) out[k] = v.doubleValue;
    else if(v.booleanValue !== undefined) out[k] = v.booleanValue;
    else if(v.nullValue !== undefined) out[k] = null;
    else if(v.mapValue !== undefined) out[k] = firestoreFieldsToObj(v.mapValue.fields||{});
    else if(v.arrayValue !== undefined) out[k] = (v.arrayValue.values||[]).map(item=>{
      if(item.stringValue !== undefined) return item.stringValue;
      if(item.integerValue !== undefined) return parseInt(item.integerValue,10);
      if(item.mapValue !== undefined) return firestoreFieldsToObj(item.mapValue.fields||{});
      return null;
    });
    else out[k] = null;
  }
  return out;
}

async function getIndex(indexDocId){
  const token = await authToken();
  const res = await fetch(`${FIRESTORE_REST_BASE}/admin_index/${indexDocId}`, { headers:{ Authorization:`Bearer ${token}` } });
  if(res.status === 404) return { ids: [] };
  if(!res.ok) return null;
  const data = await res.json();
  return { ids: firestoreFieldsToObj(data.fields).ids || [] };
}
// Lê um documento de dados do funcionário (users/{uid}/appdata/{key}, guardado
// como JSON dentro de "value"). 404 = ainda não existe (vazio de verdade);
// qualquer outra falha devolve null pra NÃO tratar erro de rede/permissão como
// "zero hora extra" — isso faria a folha sair errada sem avisar.
async function fetchAppdata(uid, key, vazio){
  const token = await authToken();
  let res;
  try{ res = await fetch(`${FIRESTORE_REST_BASE}/users/${uid}/appdata/${key}`, { headers:{ Authorization:`Bearer ${token}` } }); }
  catch(e){ return null; }
  if(res.status === 404) return vazio;
  if(!res.ok) return null;
  const data = await res.json();
  const raw = data.fields && data.fields.value && data.fields.value.stringValue;
  try{ return raw ? JSON.parse(raw) : vazio; }catch(e){ return null; }
}
const fetchRecords = uid => fetchAppdata(uid, 'ponto-records', {});
const fetchExtrasPagos = uid => fetchAppdata(uid, 'ponto-extras-pagos', []);

// --- as mesmas contas do app do funcionário e do painel do ADM ---
// Horas e hora extra vêm de ponto-core.js (regra única) — não recalcule aqui.
const timeToMinutes = PontoCore.timeToMinutes;
const formatMinutes = PontoCore.formatMinutes;
function formatBRL(v){ return (v||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'}); }
const monthKeyOf = PontoCore.monthKeyOf;

function calcDiaria(mins, employee){
  const v = (employee && employee.diariaValores) || {};
  const horas = mins/60;
  let tier = null;
  if(horas >= 8) tier = 8; else if(horas >= 6) tier = 6; else if(horas >= 4) tier = 4;
  if(tier) return { tier, valor: Number(v[tier]||v[String(tier)]||0) };
  const base = Number(v['4']||v[4]||0);
  return { tier:null, valor: base ? (base/4)*horas : 0 };
}
const calcTotal = (rec, key, employee) => PontoCore.calcDia(rec, key, employee);
function calcINSS(salarioBase){
  const faixas = [
    {ate: 1621.00, aliq: 0.075}, {ate: 2902.84, aliq: 0.09},
    {ate: 4354.27, aliq: 0.12}, {ate: 8475.55, aliq: 0.14},
  ];
  const base = Math.min(salarioBase, 8475.55);
  let total = 0, anterior = 0;
  for(const f of faixas){
    if(base > anterior){
      const faixaValor = Math.min(base, f.ate) - anterior;
      if(faixaValor > 0) total += faixaValor * f.aliq;
      anterior = f.ate;
    }else break;
  }
  return Math.round(total * 100) / 100;
}
function calcFGTS(salarioBase){ return Math.round(salarioBase * 0.08 * 100) / 100; }
function calcDescontoVT(salarioBase, valorMesVT, percentual){
  const limite = salarioBase * (percentual/100);
  return Math.round(Math.min(limite, valorMesVT) * 100) / 100;
}
const diasTrabalhadosNoMes = PontoCore.diasTrabalhadosNoMes;
// Dias de abono e de folga (hora extra convertida em folga) contam pro
// salário proporcional, mas não geram Vale Alimentação/Transporte — mesma
// regra usada no app do funcionário e no painel do ADM.
const diasAbonoNoMes = PontoCore.diasAbonoNoMes;
const diasFolgaNoMes = PontoCore.diasFolgaNoMes;
const diasUteisNoMes = PontoCore.diasUteisNoMes;
const faltasNoMes = PontoCore.faltasNoMes;
function getRemuneracao(employee){
  return {
    salario: employee.salario||0,
    va: employee.va||0,
    vaForma: employee.vaForma||'cartao',
    isCLT: employee.tipoPagamento==='clt' || employee.tipoPagamento==='mensalista',
    vtAtivo: !!employee.vtAtivo,
    vtValorDia: employee.vtValorDia||0,
    vtPercentual: employee.vtPercentual||0,
    vtForma: employee.vtForma||'cartao'
  };
}
function computeDiaristaBreakdown(records, mk, employee){
  const diasFisicos = diasTrabalhadosNoMes(records, mk);
  const diasAbono = diasAbonoNoMes(records, mk);
  const diasFolga = diasFolgaNoMes(records, mk);
  const faltas = faltasNoMes(records, mk);
  let totalMes = 0;
  Object.keys(records).filter(k=>monthKeyOf(k)===mk).forEach(k=>{
    const rec = records[k];
    // Abono/folga de diarista: valor escolhido manualmente pelo ADM (não
    // tem horário batido pra calcular sozinho).
    if(rec.abono){ totalMes += Number(rec.abono.valorDia || 0); return; }
    if(rec.folga){ totalMes += Number(rec.folga.valorDia || 0); return; }
    const t = calcTotal(rec, k, employee);
    if(t && !t.falta && t.complete) totalMes += calcDiaria(t.mins, employee).valor;
  });
  return { diarista:true, dias: diasFisicos + diasAbono + diasFolga, diasFisicos, diasAbono, diasFolga, faltas, totalMes };
}
function computeMensalBreakdown(records, mk, employee){
  const rem = getRemuneracao(employee);
  const diasUteis = diasUteisNoMes(mk);
  const diasFisicos = diasTrabalhadosNoMes(records, mk);
  const diasAbono = diasAbonoNoMes(records, mk);
  const diasFolga = diasFolgaNoMes(records, mk);
  const diasPagos = diasFisicos + diasAbono + diasFolga; // usado só pra proporção do salário
  const faltas = faltasNoMes(records, mk);
  const diaValor = diasUteis ? rem.salario / diasUteis : 0;
  let salarioMes = diaValor * diasPagos;
  if(diasPagos >= diasUteis) salarioMes = rem.salario;
  // Vale Alimentação/Transporte só nos dias fisicamente trabalhados —
  // abono e folga não geram esses benefícios.
  const vaMes = rem.va * diasFisicos;
  const out = { diasUteis, dias: diasFisicos, diasFisicos, diasAbono, diasFolga, diasPagos, faltas, salarioMes, vaMes, vaForma: rem.vaForma, isCLT: rem.isCLT, diarista:false };
  // Vale Transporte pode descontar tanto de CLT quanto de estagiário —
  // segue o mesmo cálculo do app do funcionário. O desconto legal é
  // opcional (0% = não desconta nada); o valor do vale aparece sempre.
  out.vtForma = rem.vtForma;
  if(rem.vtAtivo){
    const vtMes = rem.vtValorDia * diasFisicos;
    out.vtMes = vtMes;
    out.descontoVT = rem.vtPercentual>0 ? calcDescontoVT(salarioMes, vtMes, rem.vtPercentual) : 0;
  }else{
    out.vtMes = 0; out.descontoVT = 0;
  }
  if(rem.isCLT){
    out.inss = calcINSS(salarioMes);
    out.fgts = calcFGTS(salarioMes);
    out.salarioLiquido = salarioMes - out.inss - out.descontoVT;
  }else{
    out.salarioLiquido = salarioMes - out.descontoVT;
  }
  out.totalMes = out.salarioLiquido + vaMes + (rem.vtAtivo && rem.vtForma==='dinheiro' ? out.vtMes : 0);
  return out;
}
// Total do mês de um funcionário. Horas, hora extra e hora extra paga em
// dinheiro vêm do núcleo compartilhado — o "Total a receber" precisa bater
// com o "Total do mês (a receber)" que o funcionário vê no app dele, e lá a
// hora extra paga em dinheiro faz parte do total.
function computePayrollBreakdown(records, mk, employee, extrasPagos){
  const out = employee.tipoPagamento === 'diarista'
    ? computeDiaristaBreakdown(records, mk, employee)
    : computeMensalBreakdown(records, mk, employee);
  const horas = PontoCore.resumoHorasMes(records, mk, employee, extrasPagos);
  out.horas = horas;
  out.saldoExtraMins = PontoCore.saldoHoraExtra(records, extrasPagos, employee).saldoMins;
  out.extrasPagasMins = horas.extrasPagasMins;
  out.extrasPagasValor = horas.extrasPagasValor;
  out.totalMes += horas.extrasPagasValor;
  return out;
}
function labelForma(forma){
  return forma === 'dinheiro' ? '💵 Dinheiro' : '💳 Cartão benefício';
}
function labelTipoPagamento(tipo){
  if(tipo === 'diarista') return 'Diarista';
  if(tipo === 'estagiario') return 'Estagiário';
  return 'CLT';
}
function monthLabelOf(mk){
  const [y,m] = mk.split('-');
  const meses=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  return `${meses[+m-1]} de ${y}`;
}
const shiftMonth = PontoCore.shiftMonth;

async function loadTudo(){
  const wrap = document.getElementById('tableWrap');
  document.getElementById('monthLabel').textContent = monthLabelOf(viewMonth);
  wrap.innerHTML = 'Carregando…';
  const idx = await getIndex('employees');
  if(!idx){
    wrap.innerHTML = '<p class="error-text">Sem permissão de administrador nesta conta.</p>';
    return;
  }
  const token = await authToken();
  const resultados = await Promise.all(idx.ids.map(async (uid)=>{
    const res = await fetch(`${FIRESTORE_REST_BASE}/employees/${uid}`, { headers:{ Authorization:`Bearer ${token}` } });
    if(!res.ok) return null;
    const doc = await res.json();
    const employee = { uid, ...firestoreFieldsToObj(doc.fields) };
    const [records, extrasPagos] = await Promise.all([fetchRecords(uid), fetchExtrasPagos(uid)]);
    // null = a leitura falhou (não confundir com "sem registros"): não calcula
    // pra não mostrar um total errado como se estivesse certo.
    if(records===null || extrasPagos===null) return { employee, breakdown:null, erro:true };
    const breakdown = computePayrollBreakdown(records, viewMonth, employee, extrasPagos);
    return { employee, breakdown };
  }));
  employeesData = resultados.filter(Boolean);
  renderTabela();
}
function renderTabela(){
  const wrap = document.getElementById('tableWrap');
  if(employeesData.length===0){ wrap.innerHTML = '<p>Nenhum funcionário encontrado.</p>'; document.getElementById('totalGeral').textContent=''; return; }
  let totalGeral = 0, comErro = 0;
  wrap.innerHTML = `<div class="table-scroll"><table class="folha-table"><thead><tr>
    <th>Nome</th><th>Tipo</th><th>Dias</th><th>Faltas</th><th>H. extra</th><th>Total a receber</th><th></th>
  </tr></thead><tbody>
  ${employeesData.map(({employee, breakdown, erro})=>{
    totalGeral += breakdown ? breakdown.totalMes : 0;
    if(erro) comErro++;
    return `<tr>
      <td data-label="Nome" class="col-nome">${esc(employee.nome||'—')}</td>
      <td data-label="Tipo"><span class="tag">${labelTipoPagamento(employee.tipoPagamento)}</span></td>
      <td data-label="Dias">${breakdown?breakdown.dias:'—'}</td>
      <td data-label="Faltas">${breakdown?breakdown.faltas:'—'}</td>
      <td data-label="H. extra">${breakdown ? (breakdown.horas.extraMesMins>0 ? formatMinutes(breakdown.horas.extraMesMins) : '—') : '—'}</td>
      <td data-label="Total a receber"><strong>${breakdown?formatBRL(breakdown.totalMes):(erro?'<span class="error-text">erro ao carregar</span>':'—')}</strong></td>
      <td class="col-acao"><button class="btn small outline" data-uid="${esc(employee.uid)}">Detalhe</button></td>
    </tr>`;
  }).join('')}
  </tbody></table></div>`;
  document.getElementById('totalGeral').textContent = `Total da folha do mês: ${formatBRL(totalGeral)}` + (comErro ? ` (parcial — ${comErro} funcionário(s) não carregaram)` : '');
  wrap.querySelectorAll('button[data-uid]').forEach(btn=>{
    btn.addEventListener('click', ()=>abrirDetalhe(btn.getAttribute('data-uid')));
  });
}
function formaCheckboxes(forma){
  const cartao = forma !== 'dinheiro';
  return `<div style="font-size:12px; color:var(--muted); margin:-4px 0 8px;">
    ${cartao?'☑':'☐'} Cartão benefício &nbsp; ${!cartao?'☑':'☐'} Dinheiro
  </div>`;
}
let currentDetalheUid = null;
// Linhas de horas / hora extra — as mesmas do fechamento do mês do funcionário.
function linhasHoras(breakdown){
  const h = breakdown.horas;
  return `
    <div class="receipt-row"><span>Horas trabalhadas no mês</span><span>${formatMinutes(h.totalMesMins)}</span></div>
    ${h.complementoMesMins>0 ? `<div class="receipt-row"><span>↳ inclui complemento de jornada</span><span>${formatMinutes(h.complementoMesMins)}</span></div>` : ''}
    ${!breakdown.diarista && h.horasFaltantesMin>0 ? `<div class="receipt-row"><span>Horas faltantes no mês</span><span>${formatMinutes(h.horasFaltantesMin)}</span></div>` : ''}`;
}
function linhasExtra(breakdown){
  return `
    ${breakdown.extrasPagasValor>0 ? `<div class="receipt-row"><span>Hora extra paga em dinheiro (${formatMinutes(breakdown.extrasPagasMins)})</span><span>${formatBRL(breakdown.extrasPagasValor)}</span></div>` : ''}`;
}
function linhasExtraInfo(breakdown){
  const h = breakdown.horas;
  return `
    ${h.extraMesMins>0 ? `<div class="receipt-row"><span>Hora extra gerada neste mês</span><span>${formatMinutes(h.extraMesMins)}</span></div>` : ''}
    <div class="receipt-row"><span>Saldo de hora extra disponível</span><span>${formatMinutes(Math.max(0, breakdown.saldoExtraMins))}</span></div>`;
}
function montarLinhasHolerite(employee, breakdown){
  if(!breakdown) return '<p>Sem dados neste mês.</p>';
  if(breakdown.diarista){
    return `
      <div class="receipt-row"><span>Dias trabalhados</span><span>${breakdown.diasFisicos}</span></div>
      ${breakdown.diasAbono>0 ? `<div class="receipt-row"><span>Dias de abono</span><span>${breakdown.diasAbono}</span></div>` : ''}
      ${breakdown.diasFolga>0 ? `<div class="receipt-row"><span>Dias de folga (hora extra)</span><span>${breakdown.diasFolga}</span></div>` : ''}
      <div class="receipt-row"><span>Faltas</span><span>${breakdown.faltas}</span></div>
      ${linhasHoras(breakdown)}
      ${linhasExtra(breakdown)}
      <div class="receipt-row total"><span>Total a receber</span><span>${formatBRL(breakdown.totalMes)}</span></div>
      ${linhasExtraInfo(breakdown)}
    `;
  }
  return `
    <div class="receipt-row"><span>Dias úteis no mês</span><span>${breakdown.diasUteis}</span></div>
    <div class="receipt-row"><span>Dias trabalhados</span><span>${breakdown.dias}</span></div>
    ${breakdown.diasAbono>0 ? `<div class="receipt-row"><span>Dias de abono</span><span>${breakdown.diasAbono}</span></div>` : ''}
    ${breakdown.diasFolga>0 ? `<div class="receipt-row"><span>Dias de folga (hora extra)</span><span>${breakdown.diasFolga}</span></div>` : ''}
    <div class="receipt-row"><span>Faltas</span><span>${breakdown.faltas}</span></div>
    ${linhasHoras(breakdown)}
    <div class="receipt-row"><span>${employee.tipoPagamento==='estagiario'?'Bolsa (proporcional)':'Salário bruto (proporcional)'}</span><span>${formatBRL(breakdown.salarioMes)}</span></div>
    ${breakdown.isCLT ? `<div class="receipt-row"><span>INSS (desconto)</span><span>-${formatBRL(breakdown.inss)}</span></div>` : ''}
    ${breakdown.vtMes>0 ? `<div class="receipt-row"><span>Vale Transporte</span><span>${formatBRL(breakdown.vtMes)}</span></div>${formaCheckboxes(breakdown.vtForma)}` : ''}
    ${breakdown.descontoVT>0 ? `<div class="receipt-row"><span>Desconto legal do Vale Transporte</span><span>-${formatBRL(breakdown.descontoVT)}</span></div>` : ''}
    <div class="receipt-row"><span>${employee.tipoPagamento==='estagiario'?'Bolsa líquida':'Salário líquido'}</span><span>${formatBRL(breakdown.salarioLiquido)}</span></div>
    ${breakdown.isCLT ? `<div class="receipt-row"><span>FGTS (depositado à parte)</span><span>${formatBRL(breakdown.fgts)}</span></div>` : ''}
    <div class="receipt-row"><span>Vale Alimentação</span><span>${formatBRL(breakdown.vaMes)}</span></div>
    ${formaCheckboxes(breakdown.vaForma)}
    ${linhasExtra(breakdown)}
    <div class="receipt-row total"><span>Total a receber</span><span>${formatBRL(breakdown.totalMes)}</span></div>
    ${linhasExtraInfo(breakdown)}
  `;
}
function abrirDetalhe(uid){
  const item = employeesData.find(x=>x.employee.uid===uid);
  if(!item) return;
  currentDetalheUid = uid;
  const { employee, breakdown } = item;
  document.getElementById('detalheNome').textContent = employee.nome || '—';
  document.getElementById('detalheConteudo').innerHTML = montarLinhasHolerite(employee, breakdown);
  document.getElementById('detalheOverlay').classList.add('show');
}

// --- impressão: holerite individual e folha do mês inteira ---
// Antes isso tentava imprimir escondendo o resto da página com CSS de
// @media print — não funcionava de forma confiável no Chrome Android.
// Agora abre uma janela nova só com o conteúdo a imprimir (mesma técnica
// que já funciona no app principal de controle de ponto) e chama o print
// nessa janela — muito mais confiável em navegador mobile.
function imprimirHolerite(){
  const item = employeesData.find(x=>x.employee.uid===currentDetalheUid);
  if(!item) return;
  const { employee, breakdown } = item;
  const win = window.open('', '_blank');
  if(!win){ showAvisoPopup(); return; }
  win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Holerite — ${esc(employee.nome||'—')}</title>
    <style>
      @page{ size:A4; margin:18mm; }
      body{ font-family:Arial, Helvetica, sans-serif; color:#111; margin:0; }
      h1{ font-size:19px; margin:0 0 12px; text-transform:uppercase; }
      p{ font-size:13px; margin:4px 0; }
      .receipt-row{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed #ccc; font-size:13px; }
      .receipt-row.total{ font-weight:bold; border-bottom:none; border-top:2px solid #111; margin-top:6px; padding-top:10px; }
      .assinatura-linha{ margin-top:56px; border-top:1px solid #333; width:320px; padding-top:6px; font-size:12px; }
      .assinatura-data{ margin-top:26px; font-size:12px; }
      .rodape{ font-size:11px; color:#777; margin-top:20px; }
    </style></head><body>
      <h1>Holerite — ${esc(employee.nome||'—')}</h1>
      <p><strong>Identificação:</strong> ${esc(employee.identifier||'—')}</p>
      <p><strong>Referência:</strong> ${esc(monthLabelOf(viewMonth))}</p>
      <hr style="margin:12px 0; border:none; border-top:1px solid #ccc;">
      ${montarLinhasHolerite(employee, breakdown)}
      <div class="assinatura-linha">Assinatura do funcionário</div>
      <div class="assinatura-data">Data: ____ / ____ / ________</div>
      <p class="rodape">Gerado em ${esc(new Date().toLocaleString('pt-BR'))} — Controle de Ponto</p>
    </body></html>`);
  win.document.close();
  win.focus();
  setTimeout(()=>{ try{ win.print(); }catch(e){ /* usuário pode imprimir manualmente pela janela aberta */ } }, 300);
}
const extraTxt = b => b.horas && b.horas.extraMesMins>0 ? formatMinutes(b.horas.extraMesMins) : '—';
const extraPagaTxt = b => b.extrasPagasValor>0 ? `${formatBRL(b.extrasPagasValor)} (${formatMinutes(b.extrasPagasMins)})` : '—';
function imprimirFolha(){
  let totalGeral = 0;
  const linhas = employeesData.map(({employee, breakdown})=>{
    if(!breakdown) return '';
    totalGeral += breakdown.totalMes;
    if(breakdown.diarista){
      return `<tr><td>${esc(employee.nome||'—')}</td><td>${esc(labelTipoPagamento(employee.tipoPagamento))}</td><td>${breakdown.dias}</td><td>${breakdown.faltas}</td><td>${extraTxt(breakdown)}</td><td>—</td><td>—</td><td>—</td><td>${extraPagaTxt(breakdown)}</td><td><strong>${formatBRL(breakdown.totalMes)}</strong></td><td></td></tr>`;
    }
    return `<tr>
      <td>${esc(employee.nome||'—')}</td>
      <td>${esc(labelTipoPagamento(employee.tipoPagamento))}</td>
      <td>${breakdown.dias}/${breakdown.diasUteis}</td>
      <td>${breakdown.faltas}</td>
      <td>${extraTxt(breakdown)}</td>
      <td>${formatBRL(breakdown.salarioMes)}</td>
      <td>${breakdown.isCLT ? formatBRL(breakdown.inss) : '—'}</td>
      <td>${formatBRL(breakdown.vaMes)}${breakdown.vtMes>0 ? ' + ' + formatBRL(breakdown.vtMes) + ' VT' : ''}</td>
      <td>${extraPagaTxt(breakdown)}</td>
      <td><strong>${formatBRL(breakdown.totalMes)}</strong></td>
      <td></td>
    </tr>`;
  }).join('');
  const win = window.open('', '_blank');
  if(!win){ showAvisoPopup(); return; }
  win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Folha de Pagamento</title>
    <style>
      @page{ size:A4 landscape; margin:14mm; }
      body{ font-family:Arial, Helvetica, sans-serif; color:#111; margin:0; }
      h1{ font-size:18px; margin:0 0 2px; text-transform:uppercase; }
      .sub{ font-size:12px; color:#555; margin-bottom:16px; }
      table{ width:100%; border-collapse:collapse; font-size:10.5px; }
      th, td{ border:1px solid #999; padding:6px 8px; text-align:left; }
      th{ background:#111; color:#fff; }
      tr:nth-child(even){ background:#f5f5f5; }
      .total{ margin-top:14px; font-weight:bold; font-size:14px; }
    </style></head><body>
      <h1>Folha de Pagamento</h1>
      <div class="sub">Referência: ${esc(monthLabelOf(viewMonth))} · Gerado em ${esc(new Date().toLocaleString('pt-BR'))}</div>
      <table>
        <thead><tr><th>Nome</th><th>Tipo</th><th>Dias</th><th>Faltas</th><th>H. extra</th><th>Bruto</th><th>INSS</th><th>VA/VT</th><th>Extra paga</th><th>Total</th><th>Assinatura</th></tr></thead>
        <tbody>${linhas}</tbody>
      </table>
      <p class="total">Total geral da folha: ${formatBRL(totalGeral)}</p>
    </body></html>`);
  win.document.close();
  win.focus();
  setTimeout(()=>{ try{ win.print(); }catch(e){ /* usuário pode imprimir manualmente pela janela aberta */ } }, 300);
}
function showAvisoPopup(){
  alert('Permita pop-ups/janelas para este site no navegador pra poder imprimir.');
}

async function onLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const senha = document.getElementById('loginSenha').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if(!email || !senha){ errEl.textContent = 'Preencha e-mail e senha.'; return; }
  try{ await auth.signInWithEmailAndPassword(email, senha); }
  catch(e){ errEl.textContent = 'E-mail ou senha incorretos.'; }
}
function onLogout(){ auth.signOut(); }

auth.onAuthStateChanged(async (user)=>{
  if(user){
    document.getElementById('loginCard').classList.add('hidden');
    document.getElementById('appArea').classList.remove('hidden');
    document.getElementById('userEmailLabel').textContent = user.email;
    await loadTudo();
  }else{
    document.getElementById('appArea').classList.add('hidden');
    document.getElementById('loginCard').classList.remove('hidden');
  }
});

on('loginBtn','click', onLogin);
on('imprimirBtn','click', imprimirFolha);
on('detalheImprimir','click', imprimirHolerite);
on('logoutBtn','click', onLogout);
on('prevMonthBtn','click', ()=>{ viewMonth = shiftMonth(viewMonth,-1); loadTudo(); });
on('nextMonthBtn','click', ()=>{ viewMonth = shiftMonth(viewMonth,1); loadTudo(); });
on('detalheFechar','click', ()=>document.getElementById('detalheOverlay').classList.remove('show'));
</script>
<script>
// Enquanto um modal/menu/tela cheia está aberto, trava a rolagem da página de
// trás (no iPhone o fundo rolava junto e o modal "fugia" do dedo).
(function(){
  var SEL = '.modal-overlay.show, .drawer-overlay.show, .fullscreen-overlay.show';
  function sync(){ document.documentElement.classList.toggle('modal-aberto', !!document.querySelector(SEL)); }
  var mo = new MutationObserver(sync);
  document.querySelectorAll('.modal-overlay, .drawer-overlay, .fullscreen-overlay').forEach(function(el){
    mo.observe(el, { attributes:true, attributeFilter:['class'] });
  });
  sync();
})();
</script>
